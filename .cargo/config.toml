[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
runner = "qemu-system-aarch64 -M raspi4b -serial stdio -kernel"
rustflags = ["-C", "link-arg=-Tsrc/linker.ld", "-C", "linker=rust-lld", "-C", "force-frame-pointers=no"]

[term]
verbose = false
