name: Question / Help
about: Ask a question about using or developing LobsterOS
title: "[QUESTION] "
labels: ["question"]
assignees: ""
body:
  - type: markdown
    attributes:
      value: "Got a question? Ask away. No such thing as a dumb question here."
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What do you need help with?
      placeholder: "How do I add a new syscall? I see the table in sched/syscalls.rs but not sure about the dispatch..."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Building / toolchain setup
        - Running on QEMU
        - Running on Pi 5 hardware
        - Kernel development (adding features, drivers)
        - Userspace / shell / apps
        - Architecture / design questions
        - Debugging / profiling
        - Contributing process
        - Other
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What Have You Tried?
      description: Docs, search, experiments — helps us give a better answer.
      placeholder: "Read CONTRIBUTING.md, checked sched/mod.rs, tried adding entry to syscall_table but got link error..."
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-check
      options:
        - label: I checked the README and CONTRIBUTING.md
          required: false
        - label: I searched existing issues and discussions
          required: false
        - label: I'm not reporting a bug (use Bug Report template instead)
          required: true