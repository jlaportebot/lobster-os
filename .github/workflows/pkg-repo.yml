name: pkg-repo

# Builds the LobsterOS package catalogue from packages/, signs index.json with
# the PKG_SIGNING_KEY secret and publishes it to the normal release `pkg-repo`
# (the default repository of every install).
#   master            -> build, sign, publish (replace the release assets)
#   other refs        -> build, sign, upload a workflow artifact only
on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'tools/pkgrepo.py'
      - 'tools/test_pkgrepo.py'
      - 'tools/lobster_user.ld'
      - 'tools/micropython_min.bin'
      - 'tools/ncc-1.0.0.lobpkg'
      - '.github/workflows/pkg-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkg-repo-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: ${{ github.workspace }}/pkg-out
  RELEASE_TAG: pkg-repo

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and signing library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          python3 -m pip install --user cryptography

      - name: Test the catalogue tooling
        run: python3 -m unittest tools/test_pkgrepo.py

      - name: Build packages and index
        run: python3 tools/pkgrepo.py build "$OUT_DIR"

      - name: Sign the index
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          test -n "$PKG_SIGNING_KEY" || { echo "PKG_SIGNING_KEY secret is not set"; exit 1; }
          key_file="$RUNNER_TEMP/pkg-signing-key"
          (umask 077; printf '%s\n' "$PKG_SIGNING_KEY" > "$key_file")
          python3 tools/pkgrepo.py sign "$OUT_DIR" --key "$key_file"
          rm -f "$key_file"

      - name: Verify against the key compiled into the kernel
        run: |
          kernel_key=$(sed -n 's/^ *"\([0-9a-f]\{64\}\)";$/\1/p' src/pkg/repo.rs | head -n 1)
          test -n "$kernel_key" || { echo "no DEFAULT_REPO_KEY_HEX in src/pkg/repo.rs"; exit 1; }
          python3 tools/pkgrepo.py verify "$OUT_DIR" --pubkey "$kernel_key"
          ls -l "$OUT_DIR"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-repo
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error

      - name: Publish to the pkg-repo release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" \
            --title "LobsterOS Package Repository" \
            --notes "Signed package catalogue. Built by the pkg-repo workflow; pkg update fetches index.json and index.json.sig."
          gh release upload "$RELEASE_TAG" "$OUT_DIR"/* --clobber
          keep=$(ls "$OUT_DIR")
          for asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
            echo "$keep" | grep -qx "$asset" || gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
