[package]
name = "lobster-os"
version = "0.1.0"
edition = "2021"
authors = ["Mister Lobster"]

[features]
qemu = []  # Build for QEMU raspi4b emulation
std = []   # Enable std for host testing

[dependencies]
tock-registers = "0.9"
log = "0.4"
bitflags = "2.6"
spin = "0.9"
sha2 = { version = "0.10", default-features = false, features = [] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "signature"] }

# Test dependencies (only available when std feature is enabled)
[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
