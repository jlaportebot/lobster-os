[package]
name = "lobster-os"
version = "0.1.0"
edition = "2021"
authors = ["Mister Lobster"]

[lib]
name = "lobster_os"
path = "src/lib.rs"

[[bin]]
name = "lobster-os"
path = "src/main.rs"

[features]
std = []  # Enable std for host builds
qemu = []  # Build for QEMU raspi4b emulation
qemu_raspi5b = ["qemu"]  # Build for QEMU raspi5b emulation (implies qemu)

[dependencies]
tock-registers = "0.9"
log = "0.4"
bitflags = "2.6"
sha2 = { version = "0.10", default-features = false, features = [] }
ed25519-dalek = { version = "3.0.0-rc.1", default-features = false, features = ["signature", "legacy_compatibility"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[dev-dependencies]
heapless = "0.8"

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
