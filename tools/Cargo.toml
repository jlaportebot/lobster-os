[package]
name = "lobster-pkgbuild"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "3.0.0-rc.1", features = ["signature", "legacy_compatibility"] }

[[bin]]
name = "pkgbuild"
path = "pkgbuild.rs"

[[bin]]
name = "genindex"
path = "genindex.rs"

[[bin]]
name = "sign-index"
path = "sign_index.rs"