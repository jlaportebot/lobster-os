[package]
name = "lobster-pkgbuild"
version = "0.1.0"
edition = "2021"
description = "LobsterOS package builder for .lobpkg format"

[[bin]]
name = "pkgbuild"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", features = [] }
walkdir = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1